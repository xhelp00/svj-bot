services:
  python-api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    restart: unless-stopped

  whatsapp-bridge:
    build: ./whatsapp-bridge
    depends_on:
      - python-api
    environment:
      - PYTHON_API_URL=http://python-api:8080
      - BRIDGE_PORT=3000
      # Kept here rather than only in allowed_groups.json on the volume —
      # deleting the volume to re-scan the QR also wipes that file.
      - ALLOWED_GROUP_IDS=120363406060112788@g.us,120363401324123019@g.us
      - ADMIN_PHONE=420720994342
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "127.0.0.1:9090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  whatsapp_session:
